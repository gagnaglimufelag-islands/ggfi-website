{% extends "base.html" %}
{% block content %}
<article class="post h-entry" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="post-header"><h1 class="post-title p-name" itemprop="name headline">{{ page.title }}</h1></header>
  <div class="post-content e-content" itemprop="articleBody">{{ page.content | safe }}</div>
  <p class="post-meta">
    <time class="dt-published" datetime="{{ page.date | date(format='%Y-%m-%dT%H:%M:%S+00:00') }}" itemprop="datePublished">{{ page.date | date(format="%d/%m/%Y") }}</time>
    {% if page.updated %}<time class="dt-modified" datetime="{{ page.updated }}" itemprop="dateModified">{{ page.updated | date(format="%d/%m/%Y") }}</time>{% endif %}
    {% for author in page.authors %}<span class="p-author h-card" itemprop="author">{{ author }}</span>{% endfor %}
  </p>
  <a class="u-url" href="{{ page.permalink }}" hidden></a>
</article>
{% endblock content %}
