<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" rel="author" href="{{ get_url(path='/', trailing_slash=true) }}" aria-label="Gagnaglímufélag Íslands — forsíða">
      <img src="{{ get_url(path='assets/favicons/favicon.svg') }}" alt="" width="49" height="49">
    </a>
    <nav class="site-nav" aria-label="Aðalvalmynd">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Opna valmynd">
        <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true"><path d="M0 0h18v3H0zm0 6h18v3H0zm0 6h18v3H0z"/></svg>
      </button>
      <div id="site-navigation" class="trigger">
        {% for link in config.extra.navigation %}
        {% set active = current_path is defined and (current_path == link.path or (link.path == '/news/' and page is defined and page.date)) %}
        <a class="page-link{% if active %} active{% endif %}" href="{{ get_url(path=link.path, trailing_slash=true) }}"{% if active %} aria-current="{% if current_path == link.path %}page{% else %}true{% endif %}"{% endif %}>{{ link.title }}</a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const siteNav = document.querySelector('.site-nav');
  function closeMenu() {
    menuToggle.setAttribute('aria-expanded', 'false');
    siteNav.classList.remove('is-open');
  }
  menuToggle.addEventListener('click', () => {
    const open = menuToggle.getAttribute('aria-expanded') !== 'true';
    menuToggle.setAttribute('aria-expanded', String(open));
    siteNav.classList.toggle('is-open', open);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
      closeMenu();
      menuToggle.focus();
    }
  });
  document.addEventListener('click', event => {
    if (!siteNav.contains(event.target)) closeMenu();
  });
</script>
