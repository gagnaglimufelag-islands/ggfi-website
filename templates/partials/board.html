{% set board = load_data(path="data/board.yml") %}
<div class="board">
  {% for member in board.members %}
  <div class="board-member"><span class="member-name">{{ member.name }}</span>, <span class="member-role">{{ member.role }}</span></div>
  {% endfor %}
</div>
<p>Stjórn þessi var kosin á síðasta aðalfundi GGFÍ, þann {{ board.formed }}.</p>
